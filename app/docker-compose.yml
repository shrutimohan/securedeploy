services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: localdevonly   # local testing only; AWS uses Secrets Manager
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: localdevonly
    depends_on: [db]
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8090:80"   # reachable only from your own machine
    depends_on: [api]
