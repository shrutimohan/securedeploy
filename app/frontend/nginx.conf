server {
  listen 80;
  location / { root /usr/share/nginx/html; index index.html; }
  # Used by docker-compose only. On AWS the ALB routes /api/* straight to the API.
  # Variable + resolver so nginx still starts when the "api" host does not exist (ECS).
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $api http://api:5000;
    proxy_pass $api;
  }
}
